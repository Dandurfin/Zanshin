[pytest]
# Testy su len v tests/. Priecinok _archiv (stare subory presunute z repa,
# ostavaju na disku ako historia) ani build vystupy sa nezbieraju - archivovany
# test by inak padal na module, ktory uz v projekte nie je.
testpaths = tests
norecursedirs = .* _archiv build dist installer __pycache__
